<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>social card</title>
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{position:relative;background:linear-gradient(135deg,#1F3A5F 0%,#16304f 58%,#0F766E 100%);color:#fff;font-family:"Segoe UI",system-ui,Arial,sans-serif}
.kicker{position:absolute;left:80px;top:72px;font-size:24px;letter-spacing:.14em;text-transform:uppercase;color:#BFE6E1;font-weight:600}
.pill{position:absolute;right:80px;top:66px;background:#fff;color:#1F3A5F;font-weight:800;font-size:24px;padding:12px 22px;border-radius:999px}
h1{position:absolute;left:80px;top:124px;margin:0;font-size:84px;line-height:1.02;font-weight:800;letter-spacing:-.01em}
h1 span{color:#BFE6E1}
.stats{position:absolute;left:80px;bottom:118px;display:flex;gap:48px}
.stat b{display:block;font-size:52px;font-weight:800;line-height:1.1}
.stat span{font-size:20px;color:#D6E2F0}
.foot{position:absolute;left:80px;bottom:44px;font-size:20px;color:#D6E2F0}
.glyph{position:absolute;right:70px;bottom:40px;font-size:320px;font-weight:900;color:rgba(255,255,255,.08)}
</style>
</head>
<body>
<div class="kicker">Independent research &middot; checked 2026-10-22</div>
<div class="pill">Live-checked</div>
<h1>Free credits &amp; offers<br><span>for students and startups</span></h1>
<div class="stats">
<div class="stat"><b>236</b><span>providers</span></div>
<div class="stat"><b>1,474</b><span>verified findings</span></div>
<div class="stat"><b>15</b><span>service fronts</span></div>
</div>
<div class="foot">studentandstartupdeals.danubelabs.net</div>
<div class="glyph">$</div>
</body>
</html>
